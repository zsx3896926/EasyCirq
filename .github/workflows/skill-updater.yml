name: Skill updater packages
on:
  push:
    branches: [main, 'feat/skill-updater']
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  updater:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify updater lifecycle
        run: python -m unittest discover -s tests -p "test_*update.py" -v
      - name: Verify offline ecosystem entry points
        run: python tools/ecosystem_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install connector build dependencies
        run: npm ci --prefix connector
      - name: Build customer installer
        run: python distribution/build_release.py --output dist --require-clean
      - name: Smoke-test actual packaged installer in isolated homes
        run: python tools/release_smoke.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: easycirq-installer-${{ matrix.os }}
          path: dist/*
  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: updater
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Match release tag to skill version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(cat easycirq/.version)"
      - run: python -m unittest discover -s tests
      - run: python distribution/build_release.py --output dist --require-clean
      - run: python tools/release_smoke.py --dist dist
      - name: Attach immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/easycirq-*.zip dist/release.json dist/Manage-Skill.ps1 dist/Manage-Skill.cmd dist/skill_update.py dist/companion_update.py dist/LICENSE dist/NOTICE dist/INSTALL.md dist/SHA256SUMS

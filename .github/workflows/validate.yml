name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        python: ['3.10', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # tests/ 下有 43 个文件在**模块级** import pytest，而 unittest discover
      # 会 import 每个 test_*.py —— 不装 pytest 就 ImportError，整个 job 红在
      # 一个与代码无关的原因上。装上就解决（实测：4814 tests, OK）。
      #
      # 注意这里**不用** pytest 跑：pytest 还会执行普通函数式用例，而其中几条
      # 依赖 `reports/` 下未被 git 跟踪的本地产物（eda-api-classes.txt、
      # customer-docs），全新 checkout 里没有。换 runner 会把"3 条红"换成
      # "另外几条红"。要不要让那批用例进 CI，是另一个决定。
      - name: Install test dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check pytest
      - name: Validate structure and calculations
        run: python3 -m unittest discover -s tests -v
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run frozen task-launcher benchmark (offline, fake agent)
        run: python benchmarks/task-launcher/run_benchmark.py
      - name: Run offline placement multi-physics smoke
        run: python benchmarks/pcb-placement-multiphysics/run_benchmark.py
      - name: Run offline placement regression gates (quick)
        run: python -m mp_place.gates --quick
        working-directory: benchmarks/pcb-placement-multiphysics
      - name: Run offline placement real-board baseline check
        run: python -m mp_place.realboard_benchmark --check
        working-directory: benchmarks/pcb-placement-multiphysics
      - name: Run offline placement router resolution smoke
        run: python -m mp_place.route_resolution --quick --steps 300
        working-directory: benchmarks/pcb-placement-multiphysics
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Focused macOS smoke: the POSIX-specific paths that ubuntu does not add
      # (macOS runners are contended/slow, so the full 122-test suite is not run
      # here; it stays covered by the ubuntu `validate` matrix and `benchmark`).
      - name: Run macOS-specific task launcher smoke
        env:
          PYTHONPATH: tests
        run: >-
          python3 -X faulthandler -m unittest -v
          task_launcher_tests.test_binding.BindingTests.test_default_binding_is_loopback_and_ready_line_is_usable
          task_launcher_tests.test_timeout_cancel.TimeoutTests.test_stuck_agent_times_out_and_leaves_no_orphan
          task_launcher_tests.test_token_acl.PosixTokenModeTests.test_generated_token_file_is_0600
          task_launcher_tests.test_health_degraded.HealthTests.test_claude_probe_lists_routing_flag

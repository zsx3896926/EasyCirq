name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        python: ['3.10', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate structure and calculations
        run: python3 -m unittest discover -s tests -v
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run frozen task-launcher benchmark (offline, fake agent)
        run: python benchmarks/task-launcher/run_benchmark.py
  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run task launcher suite on macOS
        run: python3 -m unittest discover -s tests/task_launcher_tests -t tests -p "test_*.py"
      - name: Run frozen task-launcher benchmark on macOS
        run: python3 benchmarks/task-launcher/run_benchmark.py

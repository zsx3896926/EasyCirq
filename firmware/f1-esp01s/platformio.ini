; F1 rev3 carrier board - ESP-01S (ESP8266) minimal bring-up firmware.
; Board: Ai-Thinker ESP-01S, 1MB flash, 8-pin (VCC/GND/TXD/RXD/CH_PD/RST/IO0/IO2).
; Schematic: F1-USB-MCU-C rev3 (U101). Build: pio run. Flash: pio run -t upload.

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
build_flags =
    -D F1_BOARD_REV='"rev3"'
    -D F1_FW_VERSION='"0.1.0"'
upload_speed = 115200
